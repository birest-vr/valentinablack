<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — Valentina Black</title>
<meta name="description" content="News, release stories and behind-the-scenes updates from Valentina Black.">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<meta name="theme-color" content="#150a1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --accent:#1db954; --accent-2:#0e7a37;
  --text:#1a1a1a; --text-dim:#6b6b6b; --card:#f4f4f4; --border:#e8e8e8; --maxw:900px;
}
@font-face{ font-family:'Master Victory'; src:url('assets/fonts/MasterVictory-Regular.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
@font-face{ font-family:'Master Victory'; src:url('assets/fonts/MasterVictory-Italic.ttf') format('truetype'); font-weight:400; font-style:italic; font-display:swap; }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:#ffffff;border-bottom:1px solid var(--border);height:64px;box-sizing:border-box}
.nav .wordmark{font-weight:800;letter-spacing:.08em;font-size:15px;color:var(--text)}
.nav .links{display:flex;gap:22px;font-size:14px;font-weight:600}
.nav .links a{opacity:.8;transition:opacity .2s;color:var(--text)}
.nav .links a:hover{opacity:1;color:var(--accent-2)}
@media (max-width:640px){ .nav .links{display:none} }

.blog-hero{padding:130px 24px 50px;text-align:center;background:linear-gradient(180deg,#241a30 0%, #ffffff 88%)}
.blog-hero .kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.75);display:block;margin-bottom:14px}
.blog-hero h1{font-family:'Master Victory',cursive;font-style:italic;font-weight:400;font-size:clamp(38px,8vw,60px);margin:0;color:#fff}

.post-list{max-width:var(--maxw);margin:0 auto;padding:56px 24px 80px;display:flex;flex-direction:column;gap:28px}
.post-card{display:flex;gap:24px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;transition:transform .15s ease}
.post-card:hover{transform:translateY(-2px)}
.post-card img{width:96px;height:96px;border-radius:8px;object-fit:cover;flex:0 0 auto}
.post-card-body{flex:1 1 auto;min-width:0}
.post-card-date{font-size:12px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.post-card h2{font-family:'Master Victory',cursive;font-style:italic;font-weight:400;font-size:24px;margin:4px 0 8px;color:var(--text)}
.post-card p{margin:0;color:var(--text-dim);font-size:14px}
@media (max-width:560px){ .post-card{flex-direction:column;align-items:flex-start} .post-card img{width:100%;height:180px} }

footer{border-top:1px solid var(--border);padding:32px 24px;text-align:center;color:var(--text-dim);font-size:13px;background:#ffffff}
</style>
</head>
<body>
<nav class="nav">
  <a class="wordmark" href="index.html">VALENTINA BLACK</a>
  <div class="links">
    <a href="index.html#listen">Listen</a>
    <a href="blog.html">Blog</a>
    <a href="biography.html">Biography</a>
    <a href="index.html#gallery">Gallery</a>
    <a href="index.html#tour">Tour</a>
    <a href="index.html#about">Contact</a>
  </div>
</nav>

<div class="blog-hero">
  <span class="kicker">Blog</span>
  <h1>News &amp; Release Stories</h1>
</div>

<div class="post-list">
  <a class="post-card" href="blog-do-it-right.html">
    <img src="assets/do-it-right-cover.jpg" alt="Do It Right — single cover art">
    <div class="post-card-body">
      <div class="post-card-date">February 3, 2024</div>
      <h2>Do It Right</h2>
      <p>The story behind the single — a collaboration with two-time Grammy-winning producer Jon-John Robinson.</p>
    </div>
  </a>
</div>

<footer>&copy; Valentina Black. All rights reserved. &middot; <a href="index.html">valentinablack.com</a></footer>
</body>
</html>
